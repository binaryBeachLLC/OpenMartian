<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OpenMartian Console</title>
<!-- Vendored locally so the app needs NO public internet (works on a VPN-only PC). -->
<script crossorigin src="/static/vendor/react.production.min.js"></script>
<script crossorigin src="/static/vendor/react-dom.production.min.js"></script>
<script src="/static/vendor/babel.min.js"></script>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2430; --border:#30363d;
    --fg:#c9d1d9; --muted:#8b949e; --accent:#58a6ff; --accent2:#1f6feb;
    --green:#3fb950; --red:#f85149; --yellow:#d29922; --purple:#bc8cff;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; height:100%; }
  body {
    background:var(--bg); color:var(--fg);
    font-family:var(--mono); font-size:13px; line-height:1.45;
  }
  #root { height:100%; }
  a { color:var(--accent); }
  h1,h2,h3,h4 { margin:0 0 8px 0; font-weight:600; }
  h2 { font-size:15px; } h3 { font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  button {
    background:var(--panel2); color:var(--fg); border:1px solid var(--border);
    border-radius:5px; padding:5px 10px; font-family:inherit; font-size:12px;
    cursor:pointer; transition:.12s;
  }
  button:hover:not(:disabled) { border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.primary { background:var(--accent2); border-color:var(--accent2); color:#fff; }
  button.primary:hover:not(:disabled) { background:var(--accent); border-color:var(--accent); }
  button.danger { color:var(--red); border-color:#5a2a2a; }
  button.danger:hover:not(:disabled) { background:#3a1414; border-color:var(--red); }
  button.sm { padding:3px 7px; font-size:11px; }
  input,textarea,select {
    background:#0b0f14; color:var(--fg); border:1px solid var(--border);
    border-radius:5px; padding:5px 8px; font-family:inherit; font-size:12px; width:100%;
  }
  input:focus,textarea:focus,select:focus { outline:none; border-color:var(--accent); }
  textarea { resize:vertical; }
  label { display:block; font-size:11px; color:var(--muted); margin-bottom:3px; }
  .field { margin-bottom:8px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; }
  .row > * { flex:1; min-width:60px; }
  .grid { display:grid; gap:8px; }
  .panel {
    background:var(--panel); border:1px solid var(--border);
    border-radius:8px; padding:12px; margin-bottom:12px;
  }
  .panel-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .badge {
    display:inline-block; padding:2px 7px; border-radius:10px; font-size:10px;
    font-weight:600; border:1px solid var(--border); text-transform:uppercase; letter-spacing:.4px;
  }
  .badge.green { background:#0f2a16; color:var(--green); border-color:#1f5128; }
  .badge.red { background:#2a0f0f; color:var(--red); border-color:#5a2424; }
  .badge.yellow { background:#2a2410; color:var(--yellow); border-color:#5a4f1f; }
  .badge.blue { background:#0f1f2a; color:var(--accent); border-color:#1f455a; }
  .badge.gray { background:#1c2128; color:var(--muted); }
  .badge.purple { background:#221a2e; color:var(--purple); border-color:#46305a; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  .dot.green{background:var(--green);} .dot.red{background:var(--red);} .dot.gray{background:var(--muted);}
  .rec { display:inline-flex; align-items:center; gap:6px; color:var(--red); font-weight:700; font-size:11px; }
  .rec .dot { background:var(--red); animation:pulse 1s infinite; }
  @keyframes pulse { 0%{opacity:1;} 50%{opacity:.25;} 100%{opacity:1;} }
  .muted { color:var(--muted); }
  .mono { font-family:var(--mono); }
  .err { color:var(--red); font-size:11px; background:#2a0f0f; border:1px solid #5a2424;
    border-radius:5px; padding:5px 8px; margin:6px 0; white-space:pre-wrap; word-break:break-word; }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:14px; flex-wrap:wrap; }
  .tab { padding:8px 14px; cursor:pointer; border:1px solid transparent; border-bottom:none;
    border-radius:6px 6px 0 0; color:var(--muted); font-size:12px; }
  .tab:hover { color:var(--fg); }
  .tab.active { color:#fff; background:var(--panel); border-color:var(--border); }
  table { width:100%; border-collapse:collapse; font-size:11px; }
  th,td { text-align:left; padding:5px 7px; border-bottom:1px solid var(--border); vertical-align:top; }
  th { color:var(--muted); font-weight:600; text-transform:uppercase; font-size:10px; letter-spacing:.4px; }
  tr:hover td { background:var(--panel2); }
  pre { background:#0b0f14; border:1px solid var(--border); border-radius:5px; padding:8px;
    overflow:auto; font-size:11px; margin:4px 0; max-height:340px; }
  .frame-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; }
  .frame-card { background:#0b0f14; border:1px solid var(--border); border-radius:6px; padding:5px; cursor:pointer; }
  .frame-card:hover { border-color:var(--accent); }
  .frame-card img { width:100%; height:80px; object-fit:cover; border-radius:3px; display:block; background:#000; }
  .frame-meta { font-size:9px; color:var(--muted); margin-top:3px; line-height:1.3; }
  .evidence { display:flex; gap:4px; flex-wrap:wrap; }
  .ev-thumb { position:relative; width:46px; height:36px; border-radius:4px; overflow:hidden; cursor:pointer; border:2px solid var(--border); flex:none; }
  .ev-thumb.sup { border-color:var(--green); }
  .ev-thumb.ref { border-color:var(--red); }
  .ev-thumb:hover { outline:1px solid var(--accent); }
  .ev-thumb img { width:100%; height:100%; object-fit:cover; display:block; background:#000; }
  .ev-idx { position:absolute; bottom:0; right:0; font-size:8px; background:#000a; color:#fff; padding:0 2px; border-top-left-radius:3px; }
  .epi-item { display:flex; gap:8px; align-items:center; padding:6px 8px; border:1px solid var(--border);
    border-radius:6px; margin-bottom:6px; cursor:pointer; background:var(--panel2); }
  .epi-item:hover { border-color:var(--accent); }
  .epi-item.sel { border-color:var(--accent); background:#11233a; }
  .epi-item.open { outline:1px solid var(--accent); }
  .progress { background:#0b0f14; border:1px solid var(--border); border-radius:6px; height:18px; overflow:hidden; position:relative; }
  .progress .fill { background:linear-gradient(90deg,var(--accent2),var(--accent)); height:100%; transition:width .3s; min-width:2px; }
  /* shimmer: animated stripes over the in-flight bar so a long single-episode call still reads as "working" */
  .progress .fill.shimmer { background-image:linear-gradient(90deg,var(--accent2),var(--accent)),
    repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0 10px,rgba(255,255,255,0) 10px 20px);
    background-size:100% 100%,40px 100%; background-blend-mode:overlay;
    animation:shimmer 1s linear infinite; }
  @keyframes shimmer { 0%{ background-position:0 0,0 0; } 100%{ background-position:0 0,40px 0; } }
  .progress .lbl { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff; text-shadow:0 1px 2px #000; }
  .ev-thumb.proc { border-color:var(--accent); animation:pulse 1.1s ease-in-out infinite; }
  .lightbox { position:fixed; inset:0; background:rgba(0,0,0,.85); display:flex; align-items:center;
    justify-content:center; z-index:1000; cursor:zoom-out; }
  .lightbox img { max-width:92vw; max-height:88vh; border:2px solid var(--border); border-radius:6px; background:#000; }
  .lightbox .cap { position:absolute; bottom:14px; color:#fff; font-size:12px; background:#000a; padding:6px 12px; border-radius:6px; }
  .toast-wrap { position:fixed; top:12px; right:12px; z-index:2000; display:flex; flex-direction:column; gap:6px; max-width:380px; }
  .toast { background:#2a0f0f; border:1px solid var(--red); color:#ffb3ad; padding:8px 12px;
    border-radius:6px; font-size:11px; box-shadow:0 2px 12px #0008; }
  .toast.ok { background:#0f2a16; border-color:var(--green); color:#9be7a8; }
  .app { max-width:1500px; margin:0 auto; padding:14px 18px 60px; }
  .topbar { display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
  .job-strip { display:flex; align-items:center; gap:8px; margin-left:auto; padding:5px 10px;
    background:var(--panel2); border:1px solid var(--accent2); border-radius:6px; cursor:pointer; font-size:11px; }
  .job-strip:hover { border-color:var(--accent); }
  .logo { font-size:18px; font-weight:700; color:#fff; letter-spacing:.5px; }
  .logo span { color:var(--accent); }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start; }
  @media(max-width:1000px){ .cols { grid-template-columns:1fr; } }
  .img-frame { background:#000; border:1px solid var(--border); border-radius:6px; width:100%;
    height:260px; object-fit:contain; display:block; }
  .img-frame.live-big { height:440px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:11px; }
  .kv b { color:var(--muted); font-weight:500; }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--border);
    border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .scroll { max-height:420px; overflow:auto; }
  code.inline { background:#0b0f14; padding:1px 5px; border-radius:4px; font-size:11px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;

/* ---------------- api helper ---------------- */
async function api(path, opts={}) {
  const o = { headers:{}, ...opts };
  if (o.body !== undefined && !(o.body instanceof FormData)) {
    o.headers["Content-Type"] = "application/json";
    o.body = JSON.stringify(o.body);
  }
  const res = await fetch("/api" + path, o);
  const ct = res.headers.get("content-type") || "";
  let data = null;
  if (ct.includes("application/json")) data = await res.json();
  else data = await res.text();
  if (!res.ok) {
    const msg = (data && data.detail) ? data.detail : (typeof data === "string" && data ? data : res.statusText);
    throw new Error(`${res.status}: ${msg}`);
  }
  return data;
}

/* ---------------- toast context ---------------- */
const ToastCtx = React.createContext(()=>{});
function useToast(){ return React.useContext(ToastCtx); }

/* ---------------- lightbox context ---------------- */
const LightboxCtx = React.createContext(()=>{});
function useLightbox(){ return React.useContext(LightboxCtx); }

function ToastHost({ items }) {
  return (
    <div className="toast-wrap">
      {items.map(t => <div key={t.id} className={"toast" + (t.ok ? " ok":"")}>{t.msg}</div>)}
    </div>
  );
}

/* ---------------- small helpers ---------------- */
function ErrLine({ e }) { return e ? <div className="err">{String(e)}</div> : null; }
function Spin({ on, label }) { return on ? <span className="muted"><span className="spinner"/> {label||"working…"}</span> : null; }
function fmtTime(s){ if(!s) return "—"; try { return new Date(s).toLocaleString(); } catch { return s; } }
function Tokens({ t }) {
  if (!t) return <span className="muted">—</span>;
  const total = t.total_tokens ?? ((t.input_tokens||0)+(t.output_tokens||0));
  return <span title={`in ${t.input_tokens ?? "?"} / out ${t.output_tokens ?? "?"} / total ${total}`}>
    {total} <span className="muted">({t.input_tokens ?? "?"}↓/{t.output_tokens ?? "?"}↑)</span>
  </span>;
}
function NotifyBadge({ notify }) {
  if (!notify) return <span className="muted">—</span>;
  if (notify.sent) return <span className="badge green">✓ notified</span>;
  return <span className="badge yellow" title={notify.skipped_reason || "not sent"}>not sent</span>;
}

function NumField({ label, value, onChange, step }) {
  return (
    <div className="field">
      <label>{label}</label>
      <input type="number" step={step||"any"} value={value ?? ""} onChange={e=>onChange(e.target.value === "" ? "" : Number(e.target.value))} />
    </div>
  );
}

/* evidence thumbnails: cited frames for a result, green=supports / red=refutes */
function Evidence({ episodeId, evidence }) {
  const lightbox = useLightbox();
  if (!evidence || evidence.length===0) return <span className="muted">—</span>;
  return (
    <div className="evidence">
      {evidence.map((ev,i) => {
        const url = `/api/episodes/${episodeId}/frames/${ev.frame}`;
        const cap = `#${ev.frame} · ${ev.supports?"supports":"refutes"}${ev.observation?` · ${ev.observation}`:""}`;
        return (
          <div key={i} className={"ev-thumb " + (ev.supports?"sup":"ref")} title={cap}
               onClick={()=>lightbox({ url, cap })}>
            <img src={url} alt={"frame "+ev.frame} loading="lazy" />
            <span className="ev-idx">#{ev.frame}</span>
          </div>
        );
      })}
    </div>
  );
}

/* ================= WEBCAM PANEL ================= */
function WebcamPanel() {
  const toast = useToast();
  const [st, setSt] = useState(null);
  const [url, setUrl] = useState("");
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const [live, setLive] = useState(false);
  const [liveTs, setLiveTs] = useState(Date.now());
  const urlDirty = useRef(false);
  const autoStarted = useRef(false);

  const load = useCallback(async () => {
    try {
      const s = await api("/webcam");
      setSt(s);
      if (!urlDirty.current) setUrl(s.url || "");
      // auto-start the live feed once the webcam becomes reachable
      if (s.desired_connected && s.reachable === true) {
        if (!autoStarted.current) { autoStarted.current = true; setLive(true); setLiveTs(Date.now()); }
      } else {
        autoStarted.current = false;   // re-arm so a later reconnect auto-starts again
      }
    } catch(e){ setErr(e.message); }
  }, []);

  useEffect(() => { load(); const t = setInterval(load, 3000); return ()=>clearInterval(t); }, [load]);

  async function act(path, body) {
    setBusy(true); setErr(null);
    try { const s = await api(path, { method:"POST", body }); setSt(s); urlDirty.current=false; if(s.url) setUrl(s.url); }
    catch(e){ setErr(e.message); toast(e.message); }
    finally { setBusy(false); }
  }

  // single derived connection status
  let stColor="gray", stLabel="Disconnected";
  if (st) {
    if (!st.desired_connected) { stColor="gray"; stLabel="Disconnected"; }
    else if (st.reachable === true) { stColor="green"; stLabel="Connected"; }
    else if (st.reachable === false) { stColor="red"; stLabel="Unreachable"; }
    else { stColor="yellow"; stLabel="Connecting…"; }
  }
  const showDetail = st && st.detail && st.desired_connected && st.reachable === false;
  return (
    <div className="panel">
      <div className="panel-head">
        <h2>Webcam</h2>
        <div>
          {st && st.recording && <span className="rec"><span className="dot"/>RECORDING</span>}
          {st && (
            <span style={{marginLeft:10}}>
              <span className={"badge " + stColor}>{stLabel}</span>
            </span>
          )}
        </div>
      </div>
      <ErrLine e={err} />
      <div className="field">
        <label>Stream URL</label>
        <div className="row">
          <input value={url} onChange={e=>{setUrl(e.target.value); urlDirty.current=true;}} placeholder="http://camera/stream" style={{flex:4}} />
          {(st && st.desired_connected)
            ? <button disabled={busy} onClick={()=>act("/webcam/disconnect")}>Disconnect</button>
            : <button className="primary" disabled={busy} onClick={()=>act("/webcam/connect",{url})}>Connect</button>}
        </div>
      </div>
      {showDetail && <div className="err" style={{marginTop:0}}>{st.detail}</div>}
      {st && <div className="muted" style={{fontSize:11,marginBottom:8}}>{!showDetail && st.detail ? st.detail+" · " : ""}checked {fmtTime(st.checked_at)}</div>}

      <div>
        <div className="panel-head" style={{marginBottom:6}}>
          <h3 style={{margin:0}}>Live feed (preview)</h3>
          <div>
            <button className={live?"":"primary"} onClick={()=>{ setLive(v=>!v); setLiveTs(Date.now()); }}>
              {live ? "Stop live" : "Start live"}
            </button>{" "}
            <button className="sm" disabled={!live} onClick={()=>setLiveTs(Date.now())}>Reload</button>
          </div>
        </div>
        {live
          ? <img key={liveTs} className="img-frame live-big" src={`/api/webcam/stream?ts=${liveTs}`} alt="live"
                 onError={()=>setErr("Live stream failed to load (camera unreachable?)")} />
          : <div className="img-frame live-big" style={{display:"flex",alignItems:"center",justifyContent:"center"}}>
              <span className="muted">live stopped — press Start live (auto-starts when reachable)</span></div>}
      </div>
    </div>
  );
}

/* ================= CONFIG + CAPTURE ================= */
function ConfigCapturePanel({ config, setConfig, onCaptured }) {
  const toast = useToast();
  const [cap, setCap] = useState({ fps:5, frames_per_episode:20, frame_res:"640x480", jpeg_q:80 });
  const [minConf, setMinConf] = useState(0.5);
  const [count, setCount] = useState(1);
  const [savingCfg, setSavingCfg] = useState(false);
  const [capturing, setCapturing] = useState(false);
  const [err, setErr] = useState(null);

  useEffect(() => {
    if (config) {
      if (config.capture) setCap(config.capture);
      if (typeof config.min_confidence === "number") setMinConf(config.min_confidence);
    }
  }, [config]);

  const upCap = (k,v)=> setCap(c=>({ ...c, [k]:v }));

  async function saveConfig() {
    setSavingCfg(true); setErr(null);
    try {
      const c = await api("/config", { method:"PUT", body:{ capture:cap, min_confidence:Number(minConf) } });
      setConfig(c); toast("Config saved", true);
    } catch(e){ setErr(e.message); toast(e.message); }
    finally { setSavingCfg(false); }
  }

  async function capture() {
    setCapturing(true); setErr(null);
    try {
      const body = { config:cap, count:Number(count) };
      const r = await api("/episodes/capture", { method:"POST", body });
      toast(`Captured ${r.created ? r.created.length : 0} episode(s)`, true);
      onCaptured && onCaptured();
    } catch(e){ setErr(e.message); toast(e.message); }
    finally { setCapturing(false); }
  }

  return (
    <div className="panel">
      <div className="panel-head"><h2>Config &amp; Capture</h2></div>
      <ErrLine e={err} />
      <div className="cols">
        <div>
          <h3>Capture defaults</h3>
          <div className="row">
            <NumField label="fps" value={cap.fps} onChange={v=>upCap("fps",v)} />
            <NumField label="frames/episode" value={cap.frames_per_episode} onChange={v=>upCap("frames_per_episode",v)} />
          </div>
          <div className="row">
            <div className="field">
              <label>frame_res</label>
              <input value={cap.frame_res ?? ""} onChange={e=>upCap("frame_res",e.target.value)} placeholder="640x480" />
            </div>
            <NumField label="jpeg_q" value={cap.jpeg_q} onChange={v=>upCap("jpeg_q",v)} />
          </div>
          <div className="field" style={{maxWidth:200}}>
            <label>min_confidence</label>
            <input type="number" step="0.05" min="0" max="1" value={minConf} onChange={e=>setMinConf(e.target.value)} />
          </div>
          <button className="primary" disabled={savingCfg} onClick={saveConfig}>
            {savingCfg ? <span className="spinner"/> : "Save config"}
          </button>
        </div>
        <div>
          <h3>Capture episode(s)</h3>
          <div className="muted" style={{fontSize:11,marginBottom:6}}>Uses the params on the left and the connected webcam.</div>
          <div className="field" style={{maxWidth:160}}>
            <NumField label="count (episodes)" value={count} onChange={setCount} step="1" />
          </div>
          <button className="primary" disabled={capturing} onClick={capture}>
            {capturing ? <span><span className="spinner"/> capturing…</span> : "Capture"}
          </button>
          {capturing && <div className="muted" style={{marginTop:6,fontSize:11}}>This may take several seconds…</div>}
        </div>
      </div>
    </div>
  );
}

/* ================= EPISODES ================= */
function EpisodesPanel({ episodes, reload, selected, toggleSel, openId, setOpenId, onLightbox }) {
  return (
    <div className="cols">
      <div className="panel">
        <div className="panel-head">
          <h2>Episodes <span className="muted">({episodes.length})</span></h2>
          <button className="sm" onClick={reload}>Refresh</button>
        </div>
        <div className="muted" style={{fontSize:11,marginBottom:8}}>Check episodes to batch-select for processing. Click a row to open the frame viewer.</div>
        <div className="scroll">
          {episodes.length===0 && <div className="muted">No episodes yet — capture some.</div>}
          {episodes.map(ep => (
            <div key={ep.episode_id}
                 className={"epi-item" + (selected.includes(ep.episode_id)?" sel":"") + (openId===ep.episode_id?" open":"")}
                 onClick={()=>setOpenId(ep.episode_id)}>
              <input type="checkbox" style={{width:"auto",flex:"none"}} checked={selected.includes(ep.episode_id)}
                     onClick={e=>e.stopPropagation()} onChange={()=>toggleSel(ep.episode_id)} />
              <div style={{flex:1,minWidth:0}}>
                <div><b>{ep.label || ep.episode_id}</b> <span className="badge gray">{ep.frame_count} frames</span></div>
                <div className="muted" style={{fontSize:10,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                  {ep.episode_id} · {fmtTime(ep.started)} · {ep.config ? `${ep.config.fps}fps ${ep.config.frame_res} q${ep.config.jpeg_q}` : ""}
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>
      <div className="panel">
        <EpisodeViewer id={openId} onChanged={reload} onLightbox={onLightbox} />
      </div>
    </div>
  );
}

function EpisodeViewer({ id, onChanged, onLightbox }) {
  const toast = useToast();
  const [det, setDet] = useState(null);
  const [err, setErr] = useState(null);
  const [loading, setLoading] = useState(false);
  const [label, setLabel] = useState("");
  const [cfgText, setCfgText] = useState("");
  const [saving, setSaving] = useState(false);

  const load = useCallback(async () => {
    if (!id) { setDet(null); return; }
    setLoading(true); setErr(null);
    try {
      const d = await api(`/episodes/${id}`);
      setDet(d); setLabel(d.label || "");
      setCfgText(JSON.stringify(d.config || {}, null, 2));
    } catch(e){ setErr(e.message); }
    finally { setLoading(false); }
  }, [id]);

  useEffect(() => { load(); }, [load]);

  async function savePatch() {
    setSaving(true); setErr(null);
    try {
      const body = { label };
      try { body.config = JSON.parse(cfgText); }
      catch(pe){ setErr("Config JSON parse error: " + pe.message); setSaving(false); return; }
      const d = await api(`/episodes/${id}`, { method:"PATCH", body });
      setDet(d); toast("Episode updated", true); onChanged && onChanged();
    } catch(e){ setErr(e.message); toast(e.message); }
    finally { setSaving(false); }
  }

  async function del() {
    if (!confirm("Delete episode " + id + "?")) return;
    setErr(null);
    try { await api(`/episodes/${id}`, { method:"DELETE" }); toast("Deleted", true); setDet(null); onChanged && onChanged(); }
    catch(e){ setErr(e.message); toast(e.message); }
  }

  if (!id) return <div className="muted">Select an episode to view its frames.</div>;
  if (loading) return <div><span className="spinner"/> loading…</div>;
  if (!det) return <ErrLine e={err} />;

  return (
    <div>
      <div className="panel-head">
        <h2>{det.label || det.episode_id}</h2>
        <button className="danger sm" onClick={del}>Delete</button>
      </div>
      <ErrLine e={err} />
      <div className="kv" style={{marginBottom:8}}>
        <b>id</b><span>{det.episode_id}</span>
        <b>started</b><span>{fmtTime(det.started)}</span>
        <b>source</b><span style={{wordBreak:"break-all"}}>{det.source_url || "—"}</span>
        <b>frames</b><span>{det.frames ? det.frames.length : 0}</span>
      </div>
      <div className="row" style={{alignItems:"flex-start"}}>
        <div className="field" style={{flex:1}}>
          <label>label</label>
          <input value={label} onChange={e=>setLabel(e.target.value)} />
        </div>
      </div>
      <div className="field">
        <label>config (JSON)</label>
        <textarea rows={4} value={cfgText} onChange={e=>setCfgText(e.target.value)} />
      </div>
      <button className="primary" disabled={saving} onClick={savePatch}>
        {saving ? <span className="spinner"/> : "Save label/config (PATCH)"}
      </button>

      <h3 style={{marginTop:14}}>Frames</h3>
      <div className="frame-grid">
        {(det.frames||[]).map(f => (
          <div key={f.index} className="frame-card" onClick={()=>onLightbox({ url:f.url, cap:`#${f.index} · ${f.eye||""} · ${f.res} · q${f.jpeg_q} · +${f.t_offset_ms}ms` })}>
            <img src={f.url} alt={"frame "+f.index} loading="lazy" />
            <div className="frame-meta">
              #{f.index} {f.eye?`· ${f.eye}`:""}<br/>
              {f.res} q{f.jpeg_q}<br/>+{f.t_offset_ms}ms
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ================= RECIPES ================= */
function RecipePanel({ recipes, reload, selectedRecipe, setSelectedRecipe }) {
  const toast = useToast();
  const [err, setErr] = useState(null);
  const [editing, setEditing] = useState(null); // {id?, name, text, allowed_actions}
  const [busy, setBusy] = useState(false);

  function blank(){ return { name:"", text:"", allowed_actions:"" }; }

  async function save() {
    setBusy(true); setErr(null);
    const body = {
      name: editing.name, text: editing.text,
      allowed_actions: editing.allowed_actions
        ? editing.allowed_actions.split(",").map(s=>s.trim()).filter(Boolean) : []
    };
    try {
      if (editing.id) await api(`/recipes/${editing.id}`, { method:"PUT", body });
      else await api("/recipes", { method:"POST", body });
      toast("Recipe saved", true); setEditing(null); reload();
    } catch(e){ setErr(e.message); toast(e.message); }
    finally { setBusy(false); }
  }
  async function del(id) {
    if (!confirm("Delete recipe?")) return;
    try { await api(`/recipes/${id}`, { method:"DELETE" }); toast("Deleted", true);
      if (selectedRecipe===id) setSelectedRecipe(null); reload(); }
    catch(e){ setErr(e.message); toast(e.message); }
  }

  return (
    <div className="cols">
      <div className="panel">
        <div className="panel-head">
          <h2>Recipes <span className="muted">({recipes.length})</span></h2>
          <div>
            <button className="sm" onClick={reload}>Refresh</button>{" "}
            <button className="primary sm" onClick={()=>setEditing(blank())}>+ New</button>
          </div>
        </div>
        <ErrLine e={err} />
        <div className="scroll">
          {recipes.map(r => (
            <div key={r.id} className={"epi-item" + (selectedRecipe===r.id?" sel":"")} style={{cursor:"default",display:"block"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <b>{r.name}</b>
                <div>
                  <button className="sm" onClick={()=>setSelectedRecipe(selectedRecipe===r.id?null:r.id)}>
                    {selectedRecipe===r.id ? "✓ selected" : "select"}
                  </button>{" "}
                  <button className="sm" onClick={()=>setEditing({ id:r.id, name:r.name, text:r.text,
                    allowed_actions:(r.allowed_actions||[]).join(", ") })}>edit</button>{" "}
                  <button className="danger sm" onClick={()=>del(r.id)}>del</button>
                </div>
              </div>
              <div className="muted" style={{fontSize:10,whiteSpace:"pre-wrap",marginTop:3}}>{r.text}</div>
              {r.allowed_actions && r.allowed_actions.length>0 &&
                <div style={{marginTop:4}}>{r.allowed_actions.map(a=><span key={a} className="badge purple" style={{marginRight:4}}>{a}</span>)}</div>}
              <div className="muted" style={{fontSize:9,marginTop:3}}>{r.id} · {fmtTime(r.created_at)}</div>
            </div>
          ))}
          {recipes.length===0 && <div className="muted">No recipes.</div>}
        </div>
      </div>
      <div className="panel">
        <h2>{editing ? (editing.id?"Edit recipe":"New recipe") : "Editor"}</h2>
        {!editing && <div className="muted">Select "+ New" or "edit" to author a recipe.</div>}
        {editing && (
          <div>
            <div className="field"><label>name</label>
              <input value={editing.name} onChange={e=>setEditing({...editing,name:e.target.value})} /></div>
            <div className="field"><label>text (prompt)</label>
              <textarea rows={8} value={editing.text} onChange={e=>setEditing({...editing,text:e.target.value})} /></div>
            <div className="field"><label>allowed_actions (comma separated)</label>
              <input value={editing.allowed_actions} onChange={e=>setEditing({...editing,allowed_actions:e.target.value})} placeholder="move, wait, alert" /></div>
            <button className="primary" disabled={busy||!editing.name} onClick={save}>{busy?<span className="spinner"/>:"Save"}</button>{" "}
            <button onClick={()=>setEditing(null)}>Cancel</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ================= SCHEMA STORE ================= */
function SchemaPanel({ schemas, reload, selectedSchema, setSelectedSchema }) {
  const toast = useToast();
  const [sel, setSel] = useState(null);     // currently-edited schema id (null = new)
  const [name, setName] = useState("");
  const [text, setText] = useState("{}");
  const [parseErr, setParseErr] = useState(null);
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);

  // when the schema list loads/changes and nothing is being edited, open the first one
  useEffect(()=>{
    if (sel == null && schemas.length>0) loadInto(schemas[0]);
  }, [schemas]); // eslint-disable-line

  function loadInto(s) {
    setSel(s.id); setName(s.name || "");
    setText(JSON.stringify(s.schema ?? {}, null, 2)); setParseErr(null); setErr(null);
  }
  function newSchema() {
    setSel(null); setName(""); setText("{\n  \n}"); setParseErr(null); setErr(null);
  }
  function validate(t) {
    try { JSON.parse(t); setParseErr(null); return true; }
    catch(e){ setParseErr(e.message); return false; }
  }

  async function save() {
    if (!validate(text)) return;
    if (!name.trim()) { setErr("Name is required."); return; }
    setBusy(true); setErr(null);
    const body = { name: name.trim(), schema: JSON.parse(text) };
    try {
      let s;
      if (sel) s = await api(`/schemas/${sel}`, { method:"PUT", body });
      else s = await api("/schemas", { method:"POST", body });
      toast("Schema saved", true);
      await reload();
      loadInto(s);
    } catch(e){ setErr(e.message); toast(e.message); }
    finally { setBusy(false); }
  }
  async function del() {
    if (!sel) return;
    if (!confirm("Delete schema?")) return;
    setErr(null);
    try { await api(`/schemas/${sel}`, { method:"DELETE" });
      toast("Deleted", true);
      if (selectedSchema===sel) setSelectedSchema(null);
      newSchema(); await reload(); }
    catch(e){ setErr(e.message); toast(e.message); }
  }
  async function loadDefault() {
    setErr(null);
    try { const def = await api("/schema/default"); setText(JSON.stringify(def, null, 2)); setParseErr(null);
      toast("Loaded default into editor (not yet saved)", true); }
    catch(e){ setErr(e.message); toast(e.message); }
  }

  return (
    <div className="cols">
      <div className="panel">
        <div className="panel-head">
          <h2>Schemas <span className="muted">({schemas.length})</span></h2>
          <div><button className="sm" onClick={reload}>Refresh</button>{" "}
            <button className="primary sm" onClick={newSchema}>+ New</button></div>
        </div>
        <div className="muted" style={{fontSize:11,marginBottom:8}}>Structured-output schemas the LLM is forced to return. Mark one as the default used for processing.</div>
        <div className="scroll">
          {schemas.map(s => (
            <div key={s.id} className={"epi-item"+(sel===s.id?" open":"")+(selectedSchema===s.id?" sel":"")} style={{display:"block"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <b style={{cursor:"pointer"}} onClick={()=>loadInto(s)}>{s.name}</b>
                <div>
                  <button className="sm" onClick={()=>setSelectedSchema(selectedSchema===s.id?null:s.id)}>
                    {selectedSchema===s.id ? "✓ selected" : "select"}
                  </button>{" "}
                  <button className="sm" onClick={()=>loadInto(s)}>edit</button>
                </div>
              </div>
              <div className="muted" style={{fontSize:9,marginTop:3}}>{s.id} · {fmtTime(s.created_at)}</div>
            </div>
          ))}
          {schemas.length===0 && <div className="muted">No schemas — create one.</div>}
        </div>
      </div>
      <div className="panel">
        <div className="panel-head"><h2>{sel ? "Edit schema" : "New schema"}</h2>
          {sel && <button className="danger sm" onClick={del}>Delete</button>}</div>
        <ErrLine e={err} />
        <div className="field"><label>name</label>
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="schema name" /></div>
        <div className="field"><label>schema (JSON)</label>
          <textarea rows={16} value={text} onChange={e=>{ setText(e.target.value); validate(e.target.value); }} /></div>
        {parseErr && <div className="err">JSON: {parseErr}</div>}
        <div style={{marginTop:8}}>
          <button className="primary" disabled={busy||!!parseErr} onClick={save}>{busy?<span className="spinner"/>:(sel?"Save":"Create")}</button>{" "}
          <button disabled={busy} onClick={loadDefault}>Load default into editor</button>
        </div>
      </div>
    </div>
  );
}

/* ================= JOB VIEW (shared) ================= */
function jobStatusClass(s){ return s==="done"?"green":s==="error"?"red":"yellow"; }

function JobProgress({ job, mini }) {
  const total = job.total || 0;
  const completed = job.completed || 0;
  const pct = total ? Math.round((completed/total)*100) : (job.status==="done"?100:0);
  const running = job.status === "running";
  return (
    <div className="progress" style={mini?{height:14,minWidth:120}:null}>
      <div className={"fill" + (running?" shimmer":"")} style={{width:pct+"%"}} />
      <div className="lbl">
        {mini
          ? `${pct}% · ${completed}/${total}`
          : `${pct}%  ·  ${completed}/${total} episodes${running && job.current_episode ? ` · ${job.current_episode}` : ""}`}
      </div>
    </div>
  );
}

/* "now processing" — frames of the in-flight episode (one atomic call; per-episode, not per-frame) */
function NowProcessing({ episodes, currentEpisode }) {
  if (!currentEpisode) return null;
  const ep = (episodes || []).find(e => e.episode_id === currentEpisode);
  const n = ep ? (ep.frame_count || 0) : 0;
  const lightbox = useLightbox();
  return (
    <div className="now-proc" style={{marginTop:10}}>
      <div className="muted" style={{fontSize:11,marginBottom:5}}>
        <span className="spinner" /> processing episode <span className="mono">{currentEpisode}</span>
        {ep ? ` — ${n} frame${n===1?"":"s"}` : " — loading frames…"}
      </div>
      {n > 0 && (
        <div className="evidence">
          {Array.from({length:n}).map((_,i) => {
            const url = `/api/episodes/${currentEpisode}/frames/${i}`;
            return (
              <div key={i} className="ev-thumb proc" title={`frame #${i}`} onClick={()=>lightbox({ url, cap:`${currentEpisode} · frame #${i}` })}>
                <img src={url} alt={"frame "+i} loading="lazy" />
                <span className="ev-idx">#{i}</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function JobResultsTable({ results }) {
  if (!results || results.length===0) return null;
  return (
    <table style={{marginTop:10}}>
      <thead><tr><th>episode</th><th>match</th><th>conf</th><th>action</th><th>notify</th><th>evidence</th><th>tokens</th><th>ms</th><th>reason</th></tr></thead>
      <tbody>
        {results.map(r => {
          const d = r.decision;
          return (
            <tr key={r.id}>
              <td className="mono">{r.episode_id}</td>
              <td>{r.error ? <span className="badge red">err</span> : d ? <span className={"badge "+(d.match?"green":"red")}>{d.match?"match":"no"}</span> : <span className="badge gray">—</span>}</td>
              <td>{d ? (typeof d.confidence==="number"?d.confidence.toFixed(2):d.confidence) : "—"}</td>
              <td>{d ? <span className="badge blue">{d.action}</span> : "—"}</td>
              <td><NotifyBadge notify={r.notify} /></td>
              <td><Evidence episodeId={r.episode_id} evidence={d && d.evidence} /></td>
              <td><Tokens t={r.tokens} /></td>
              <td>{r.latency_ms}</td>
              <td style={{maxWidth:240}}>{r.error ? <span className="badge red">{r.error}</span> : (d?d.reason:"")}</td>
            </tr>
          );
        })}
      </tbody>
    </table>
  );
}

function JobCard({ job, episodes }) {
  return (
    <div className="panel">
      <div className="panel-head" style={{marginBottom:6}}>
        <h3 style={{margin:0}}>Job {job.job_id} <span className="muted" style={{textTransform:"none"}}>· {job.backend}/{job.model}</span></h3>
        <div>
          <span className={"badge "+jobStatusClass(job.status)}>{job.status}</span>{" "}
          {job.tokens && <span className="badge gray">tokens <Tokens t={job.tokens} /></span>}
        </div>
      </div>
      <JobProgress job={job} />
      {job.status==="running" && <NowProcessing episodes={episodes} currentEpisode={job.current_episode} />}
      {job.recipe_text && <div className="muted" style={{fontSize:11,marginTop:6,whiteSpace:"pre-wrap"}} title={job.recipe_text}>recipe: {job.recipe_text.length>200?job.recipe_text.slice(0,200)+"…":job.recipe_text}</div>}
      {job.error && <div className="err" style={{marginTop:6}}>{job.error}</div>}
      <JobResultsTable results={job.results} />
    </div>
  );
}

function JobsPanel({ jobs, episodes, reload, clearFinished }) {
  return (
    <div>
      <div className="panel-head">
        <h2>Jobs <span className="muted">({jobs.length})</span></h2>
        <div><button className="sm" onClick={reload}>Refresh</button>{" "}
          <button className="danger sm" onClick={clearFinished}>Clear finished</button></div>
      </div>
      {jobs.length===0 && <div className="panel muted">No jobs yet — start one in the Process tab.</div>}

    </div>

}

/* ================= PROCESS ================= */
function ProcessPanel({ episodes, selectedIds, recipes, selectedRecipe, model, config,
                        schemas, selectedSchema, paramSpecs,
                        activeJob, startJob, gotoJobs }) {
  const toast = useToast();
  const [minConf, setMinConf] = useState(0.5);
  const [params, setParams] = useState({});   // per-param-key values for current backend
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  useEffect(()=>{ if(config && typeof config.min_confidence==="number") setMinConf(config.min_confidence); }, [config]);

  const backend = model ? model.backend : null;
  const specs = (backend && paramSpecs && paramSpecs[backend]) ? paramSpecs[backend] : [];

  // when backend (or its specs) changes, reset params to the specs' defaults
  useEffect(()=>{
    const init = {};
    specs.forEach(sp => { if (!sp.optional && sp.default != null) init[sp.key] = sp.default; });
    setParams(init);
  }, [backend, paramSpecs]); // eslint-disable-line

  const recipe = recipes.find(r=>r.id===selectedRecipe);
  const schema = schemas.find(s=>s.id===selectedSchema);
  // a job is in progress if the App-tracked active job is still running
  const running = activeJob && activeJob.status === "running";

  function setParam(key, raw, type) {
    setParams(p => {
      const next = { ...p };
      if (raw === "" || raw == null) delete next[key];
      else next[key] = type==="int" ? parseInt(raw,10) : parseFloat(raw);
      return next;
    });
  }

  async function run() {
    setBusy(true); setErr(null);
    try {
      if (!model) throw new Error("Select a model in the Models tab first.");
      if (selectedIds.length===0) throw new Error("Select at least one episode (checkbox in Episodes tab).");
      // collect only non-empty / finite params
      const cleanParams = {};
      Object.keys(params).forEach(k => { const v = params[k]; if (v!=="" && v!=null && !Number.isNaN(v)) cleanParams[k] = v; });
      const body = {
        episode_ids: selectedIds,
        backend: model.backend, model: model.model,
        min_confidence: Number(minConf),
        params: cleanParams,
      };
      if (selectedSchema) body.schema_id = selectedSchema;
      if (!selectedRecipe) throw new Error("Select a recipe in the Recipes tab.");
      body.recipe_id = selectedRecipe;
      const snap = await api("/process", { method:"POST", body });   // immediate job snapshot
      toast(`Job ${snap.job_id} started`, true);
      startJob(snap);   // hand off to App-level tracker (polling lives there)
    } catch(e){ setErr(e.message); toast(e.message); }
    finally { setBusy(false); }
  }

  return (
    <div className="panel">
      <div className="panel-head"><h2>Process</h2></div>
      <ErrLine e={err} />
      <div className="kv" style={{marginBottom:10}}>
        <b>episodes</b><span>{selectedIds.length ? selectedIds.map(id=><span key={id} className="badge blue" style={{marginRight:4}}>{id}</span>) : <span className="muted">none selected</span>}</span>
        <b>recipe</b><span>{recipe ? <span className="badge purple">{recipe.name}</span> : <span className="muted">none — select in Recipes tab</span>}</span>
        <b>model</b><span>{model ? <span className="badge green">{model.backend} / {model.model}</span> : <span className="muted">none</span>}</span>
        <b>schema</b><span>{schema ? <span className="badge purple">{schema.name}</span> : <span className="muted">none — select in Schema tab</span>}</span>
      </div>

      <div className="row" style={{maxWidth:260}}>
        <div className="field"><label>min_confidence</label>
          <input type="number" step="0.05" min="0" max="1" value={minConf} onChange={e=>setMinConf(e.target.value)} /></div>
      </div>

      <div className="field">
        <label>runtime params {backend ? <span className="muted">({backend})</span> : <span className="muted">(select a model)</span>}</label>
        {specs.length===0
          ? <div className="muted" style={{fontSize:11}}>{backend ? "no tunable params for this backend" : "—"}</div>
          : <div className="row" style={{flexWrap:"wrap"}}>
              {specs.map(sp => (
                <div className="field" key={sp.key} style={{minWidth:120,flex:"0 1 140px"}}>
                  <label title={sp.key}>{sp.label || sp.key}{sp.optional ? <span className="muted"> (opt)</span> : ""}</label>
                  <input type="number" step={sp.step ?? "any"} min={sp.min} max={sp.max}
                         value={params[sp.key] ?? ""}
                         placeholder={sp.optional ? "—" : (sp.default!=null?String(sp.default):"")}
                         onChange={e=>setParam(sp.key, e.target.value, sp.type)} />
                </div>
              ))}
            </div>}
      </div>

      <div className="muted" style={{fontSize:11,marginBottom:8}}>matches with action=notify are posted to Discord (configured server-side)</div>

      <button className="primary" disabled={busy||running||!selectedRecipe} onClick={run}
              title={!selectedRecipe ? "select a recipe in the Recipes tab" : ""} style={{padding:"10px 24px",fontSize:14}}>
        {(busy||running) ? <span><span className="spinner"/> processing…</span> : `▶ Process ${selectedIds.length} episode(s)`}
      </button>
      {!selectedRecipe && <div className="muted" style={{fontSize:11,marginTop:6}}>select a recipe in the Recipes tab to enable processing</div>}

      {activeJob && (
        <div style={{marginTop:14}}>
          <div className="muted" style={{fontSize:11,marginBottom:6}}>
            Live job (tracked globally — stays running if you switch tabs). <a href="#" onClick={e=>{e.preventDefault(); gotoJobs();}}>Open Jobs tab →</a>
          </div>
          <JobCard job={activeJob} episodes={episodes} />
        </div>
      )}
    </div>
  );
}

/* ================= RUNS TABLE ================= */
function RunsTable({ runs, reload, clearRuns }) {
  const [open, setOpen] = useState({});
  return (
    <div className="panel">
      <div className="panel-head">
        <h2>Runs / Outputs <span className="muted">({runs.length})</span></h2>
        <div><button className="sm" onClick={reload}>Refresh</button>{" "}
          <button className="danger sm" onClick={clearRuns}>Clear runs</button></div>
      </div>
      <div className="scroll" style={{maxHeight:560}}>
      <table>
        <thead><tr>
          <th></th><th>episode</th><th>backend/model</th><th>recipe</th><th>match</th>
          <th>conf</th><th>action</th><th>notify</th><th>evidence</th><th>tokens</th><th>reason</th><th>ms</th><th>when</th>
        </tr></thead>
        <tbody>
          {runs.map(r => {
            const d = r.decision;
            const isOpen = open[r.id];
            return (
              <React.Fragment key={r.id}>
                <tr>
                  <td><button className="sm" onClick={()=>setOpen(o=>({...o,[r.id]:!o[r.id]}))}>{isOpen?"▼":"▶"}</button></td>
                  <td className="mono">{r.episode_id}</td>
                  <td>{r.backend}<br/><span className="muted">{r.model}</span></td>
                  <td style={{maxWidth:160,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={r.recipe_text}>{r.recipe_text}</td>
                  <td>{r.error ? <span className="badge red">err</span> : d ? <span className={"badge "+(d.match?"green":"red")}>{d.match?"match":"no"}</span> : <span className="badge gray">—</span>}</td>
                  <td>{d ? (typeof d.confidence==="number"?d.confidence.toFixed(2):d.confidence) : "—"}</td>
                  <td>{d ? <span className="badge blue">{d.action}</span> : "—"}</td>
                  <td><NotifyBadge notify={r.notify} /></td>
                  <td><Evidence episodeId={r.episode_id} evidence={d && d.evidence} /></td>
                  <td><Tokens t={r.tokens} /></td>
                  <td style={{maxWidth:220}}>{r.error ? <span className="badge red">{r.error}</span> : (d?d.reason:"")}</td>
                  <td>{r.latency_ms}</td>
                  <td className="muted">{fmtTime(r.created_at)}</td>
                </tr>
                {isOpen && (
                  <tr><td colSpan="13">
                    {d && d.message && <div style={{marginBottom:6}}><b className="muted">message:</b> {d.message}</div>}
                    <div style={{marginBottom:6}}>
                      <b className="muted">Notify:</b>{" "}
                      {r.notify
                        ? (r.notify.sent
                            ? <span className="badge green">✓ notified — Discord notification sent</span>
                            : <span>not sent{r.notify.skipped_reason ? <span className="muted"> — {r.notify.skipped_reason}</span> : ""}</span>)
                        : <span className="muted">—</span>}
                    </div>
                    {d && d.evidence && d.evidence.length>0 && (
                      <div style={{marginBottom:6}}>
                        <b className="muted">evidence:</b>
                        <Evidence episodeId={r.episode_id} evidence={d.evidence} />
                        <ul style={{margin:"4px 0 0",paddingLeft:18}}>
                          {d.evidence.map((ev,i)=>(
                            <li key={i} style={{fontSize:11}}>
                              <span className={"badge "+(ev.supports?"green":"red")}>#{ev.frame} {ev.supports?"supports":"refutes"}</span>{" "}
                              <span className="muted">{ev.observation}</span>
                            </li>
                          ))}
                        </ul>
                      </div>
                    )}
                    {r.error && <div className="err">{r.error}</div>}
                    <div className="muted" style={{fontSize:10}}>run_id: {r.run_id} · result id: {r.id}</div>
                    <b className="muted">raw_output:</b>
                    <pre>{r.raw_output ? JSON.stringify(r.raw_output, null, 2) : "null"}</pre>
                  </td></tr>
                )}
              </React.Fragment>
            );
          })}
          {runs.length===0 && <tr><td colSpan="13" className="muted">No runs yet.</td></tr>}
        </tbody>
      </table>
      </div>
    </div>
  );
}

/* ================= APP ================= */
function App() {
  const [tab, setTab] = useState("control");
  const [toasts, setToasts] = useState([]);
  const toast = useCallback((msg, ok=false) => {
    const id = Math.random().toString(36).slice(2);
    setToasts(t=>[...t,{id,msg,ok}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)), 4500);
  }, []);

  // shared state
  const [config, setConfig] = useState(null);
  const [episodes, setEpisodes] = useState([]);
  const [recipes, setRecipes] = useState([]);
  const [models, setModels] = useState([]);
  const [runs, setRuns] = useState([]);
  const [selectedIds, setSelectedIds] = useState([]);
  const [selectedRecipe, setSelectedRecipe] = useState(null);
  const [model, setModel] = useState(null);
  const [openEpId, setOpenEpId] = useState(null);
  const [lightbox, setLightbox] = useState(null);
  const [schemas, setSchemas] = useState([]);
  const [selectedSchema, setSelectedSchema] = useState(null);
  const [paramSpecs, setParamSpecs] = useState(null);

  // ---- global job tracking (persists across tab switches & page refresh) ----
  const [jobs, setJobs] = useState([]);          // newest first
  const [activeJobId, setActiveJobId] = useState(null);
  const pollRef = useRef(null);
  const prevRunningRef = useRef(new Set());      // job_ids that were running last tick

  const loadConfig = useCallback(()=> api("/config").then(setConfig).catch(e=>toast(e.message)), [toast]);
  const loadEpisodes = useCallback(()=> api("/episodes").then(setEpisodes).catch(e=>toast(e.message)), [toast]);
  const loadRecipes = useCallback(()=> api("/recipes").then(setRecipes).catch(e=>toast(e.message)), [toast]);
  const loadModels = useCallback(()=> api("/models").then(setModels).catch(e=>toast(e.message)), [toast]);
  const loadRuns = useCallback(()=> api("/runs?limit=200").then(setRuns).catch(e=>toast(e.message)), [toast]);
  const loadSchemas = useCallback(async ()=>{
    try { const list = await api("/schemas"); setSchemas(list||[]);
      // default the processing selection to the first schema if none chosen
      setSelectedSchema(cur => cur || (list && list.length ? list[0].id : null));
    } catch(e){ toast(e.message); }
  }, [toast]);
  const loadParamSpecs = useCallback(()=> api("/param-specs").then(setParamSpecs).catch(e=>toast(e.message)), [toast]);

  // merge incoming job snapshots into the jobs list (newest first), detect completions
  const mergeJobs = useCallback((incoming) => {
    setJobs(prev => {
      const map = new Map(prev.map(j=>[j.job_id, j]));
      incoming.forEach(j=> map.set(j.job_id, { ...map.get(j.job_id), ...j }));
      const arr = [...map.values()];
      arr.sort((a,b)=> (b.started_at||"").localeCompare(a.started_at||""));
      // detect jobs that just transitioned out of "running"
      const wasRunning = prevRunningRef.current;
      const nowRunning = new Set();
      arr.forEach(j => {
        if (j.status === "running") nowRunning.add(j.job_id);
        else if (wasRunning.has(j.job_id)) {
          if (j.status === "error") toast(`Job ${j.job_id} error: ${j.error||""}`);
          else toast(`Job ${j.job_id} done · ${j.results?j.results.length:0} result(s) · ${j.tokens?j.tokens.total_tokens:0} tok`, true);
          loadRuns();
        }
      });
      prevRunningRef.current = nowRunning;
      return arr;
    });
  }, [toast, loadRuns]);

  const loadJobs = useCallback(async () => {
    try { const list = await api("/jobs"); mergeJobs(list || []); }
    catch(e){ /* jobs endpoint optional/transient; surface quietly */ }
  }, [mergeJobs]);

  // initial mount: load everything + recover any running job from GET /api/jobs
  useEffect(()=>{ loadConfig(); loadEpisodes(); loadRecipes(); loadModels(); loadRuns(); loadJobs(); loadSchemas(); loadParamSpecs(); }, []);

  // global poller: runs while any job is "running"
  const anyRunning = jobs.some(j => j.status === "running");
  useEffect(() => {
    if (anyRunning) {
      if (!pollRef.current) pollRef.current = setInterval(loadJobs, 1500);
    } else {
      if (pollRef.current) { clearInterval(pollRef.current); pollRef.current = null; }
    }
    return ()=>{ if(pollRef.current){ clearInterval(pollRef.current); pollRef.current=null; } };
  }, [anyRunning, loadJobs]);

  const startJob = useCallback((snap) => {
    setActiveJobId(snap.job_id);
    mergeJobs([snap]);
    if (snap.status !== "running") loadRuns();  // already finished synchronously
  }, [mergeJobs, loadRuns]);

  const toggleSel = (id)=> setSelectedIds(s => s.includes(id) ? s.filter(x=>x!==id) : [...s,id]);
  async function clearRuns() {
    if(!confirm("Clear all runs?")) return;
    try { await api("/runs", { method:"DELETE" }); setRuns([]); toast("Runs cleared", true); }
    catch(e){ toast(e.message); }
  }
  async function clearFinishedJobs() {
    try { await api("/jobs", { method:"DELETE" }); toast("Cleared finished jobs", true);
      setJobs(prev => prev.filter(j=>j.status==="running")); loadJobs(); }
    catch(e){ toast(e.message); }
  }

  const activeJob = jobs.find(j => j.job_id === activeJobId)
    || jobs.find(j => j.status === "running") || null;
  const runningJob = jobs.find(j => j.status === "running") || null;

  const TABS = [
    ["control","Control"], ["episodes","Episodes"], ["recipes","Recipes"],
    ["models","Models"], ["schema","Schema"], ["process","Process"],
    ["jobs","Jobs"], ["runs","Runs"],
  ];

  return (
    <ToastCtx.Provider value={toast}>
    <LightboxCtx.Provider value={setLightbox}>
      <ToastHost items={toasts} />
      {lightbox && (
        <div className="lightbox" onClick={()=>setLightbox(null)}>
          <img src={lightbox.url} alt="frame" />
          <div className="cap">{lightbox.cap}</div>
        </div>
      )}
      <div className="app">
        <div className="topbar">
          <div className="logo">Open<span>Martian</span> Console</div>
          <div className="muted" style={{fontSize:11}}>
            {selectedIds.length} ep selected · model: {model?`${model.backend}/${model.model}`:"none"} · recipe: {selectedRecipe?(recipes.find(r=>r.id===selectedRecipe)||{}).name||selectedRecipe:"none"} · schema: {selectedSchema?(schemas.find(s=>s.id===selectedSchema)||{}).name||selectedSchema:"none"}
          </div>
          {runningJob && (
            <div className="job-strip" onClick={()=>{ setActiveJobId(runningJob.job_id); setTab("jobs"); }} title="Click to open Jobs tab">
              <span className="spinner" />
              <span className="badge yellow">running</span>
              <span className="muted">{runningJob.model}</span>
              <div style={{minWidth:130}}><JobProgress job={runningJob} mini /></div>
              {runningJob.tokens && <span className="muted">{runningJob.tokens.total_tokens} tok</span>}
            </div>
          )}
        </div>
        <div className="tabs">
          {TABS.map(([k,l]) => <div key={k} className={"tab"+(tab===k?" active":"")} onClick={()=>setTab(k)}>{l}</div>)}
        </div>

        {tab==="control" && <>
          <WebcamPanel />
          <ConfigCapturePanel config={config} setConfig={setConfig} onCaptured={loadEpisodes} />
        </>}

        {tab==="episodes" &&
          <EpisodesPanel episodes={episodes} reload={loadEpisodes} selected={selectedIds}
            toggleSel={toggleSel} openId={openEpId} setOpenId={setOpenEpId} onLightbox={setLightbox} />}

        {tab==="recipes" &&
          <RecipePanel recipes={recipes} reload={loadRecipes} selectedRecipe={selectedRecipe} setSelectedRecipe={setSelectedRecipe} />}

        {tab==="models" &&
          <ModelPanel models={models} reload={loadModels} sel={model} setSel={setModel} />}

        {tab==="schema" &&
          <SchemaPanel schemas={schemas} reload={loadSchemas} selectedSchema={selectedSchema} setSelectedSchema={setSelectedSchema} />}

        {tab==="process" &&
          <ProcessPanel episodes={episodes} selectedIds={selectedIds} recipes={recipes}
            selectedRecipe={selectedRecipe} model={model} config={config}
            schemas={schemas} selectedSchema={selectedSchema} paramSpecs={paramSpecs}
            activeJob={activeJob} startJob={startJob} gotoJobs={()=>setTab("jobs")} />}

        {tab==="jobs" &&
          <JobsPanel jobs={jobs} episodes={episodes} reload={loadJobs} clearFinished={clearFinishedJobs} />}

        {tab==="runs" &&
          <RunsTable runs={runs} reload={loadRuns} clearRuns={clearRuns} />}
      </div>
    </LightboxCtx.Provider>
    </ToastCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
